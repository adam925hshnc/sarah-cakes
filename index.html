<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarah Tallat | Cake Art</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
/* ======= RESET ======= */
* {margin:0;padding:0;box-sizing:border-box;}
body {font-family:'Poppins',sans-serif; background:#fffaf7; color:#333;}
a {text-decoration:none;}

/* ======= HERO ======= */
.hero {
  min-height:100vh;
  background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)), url("Poloty6.jpg") center/cover no-repeat;
  display:flex; align-items:center; justify-content:center; text-align:center; color:#fff;
  flex-direction:column;
}
.hero h1 {font-family:'Playfair Display',serif; font-size:64px; letter-spacing:2px; margin-bottom:15px;}
.hero p {font-size:22px; margin-bottom:25px;}
.hero a {
  display:inline-block; padding:15px 35px; background:#d4a373; color:#fff; border-radius:40px; font-size:18px; transition:.3s;
}
.hero a:hover {background:#b8895b; transform:scale(1.05);}

/* ======= SECTIONS ======= */
section {padding:70px 8%;}
section h2 {text-align:center; font-family:'Playfair Display',serif; font-size:38px; margin-bottom:40px; color:#5a3e36;}

/* ======= GALLERY ======= */
.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}
.gallery img {
  width:100%;
  border-radius:18px;
  cursor:pointer;
  transition:.4s;
}
.gallery img:hover {
  transform:scale(1.06);
  box-shadow:0 20px 40px rgba(0,0,0,.25);
}

/* ======= LIGHT SECTION ======= */
.light {background:#fdf3ea;}

/* ======= FOOTER ======= */
footer {
  background:#111;
  color:#fff;
  text-align:center;
  padding:40px 20px;
}
footer a {color:#d4a373; font-size:22px;}
footer p {margin-bottom:12px; font-size:18px;}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <h1>Sarah Tallat</h1>
  <p>تحف التورت اللي بتتحول لفن 🎂✨</p>

<!-- JS -->
<script>
console.log("Sarah Tallat Website Loaded");

// اختياري: اضغط على صورة تكبر
const images = document.querySelectorAll(".gallery img");
images.forEach(img => {
  img.addEventListener("click", ()=> {
    const src = img.getAttribute("src");
    const w = window.open("");
    w.document.write(`<img src="${src}" style="width:100%">`);
  });
});
</script>
