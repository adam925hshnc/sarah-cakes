<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarah Tallat | Cake Art</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
/* ===== RESET ===== */
* {margin:0; padding:0; box-sizing:border-box;}
body {font-family:'Poppins',sans-serif; scroll-behavior:smooth;}

/* ===== BACKGROUND ANIMATION ===== */
body {
  background: linear-gradient(-45deg, #ffecd2, #fcb69f, #ffecd2, #fbc2eb);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
}
@keyframes gradientBG {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* ===== HERO ===== */
.hero {
  min-height:80vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px 20px;
}
.hero h1 {font-family:'Playfair Display',serif; font-size:60px; color:#5a3e36; margin-bottom:15px;}
.hero p {font-size:22px; color:#6b4f3f; margin-bottom:25px;}
.hero .buttons a {
  display:inline-block;
  margin:5px;
  padding:15px 30px;
  border-radius:35px;
  background:#d4a373;
  color:#fff;
  font-weight:600;
  font-size:18px;
  transition:.3s;
}
.hero .buttons a:hover {background:#b8895b; transform:scale(1.05);}

/* ===== SECTIONS ===== */
section {padding:60px 8%;}
section h2 {text-align:center; font-family:'Playfair Display',serif; font-size:36px; margin-bottom:40px; color:#5a3e36;}

/* ===== GALLERY ===== */
.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}
.gallery .img-box {
  overflow:hidden;
  border-radius:20px;
  background:#fff;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  transition:.4s;
}
.gallery .img-box img {
  width:100%;
  display:block;
  transition:.4s;
}
.gallery .img-box:hover img {
  transform:scale(1.08);
}

/* ===== BUTTONS UNDER GALLERY ===== */
.action-buttons {
  text-align:center;
  margin-top:40px;
}
.action-buttons a {
  display:inline-block;
  margin:8px;
  padding:12px 28px;
  border-radius:30px;
  background:#d4a373;
  color:#fff;
  font-weight:600;
  font-size:18px;
  transition:.3s;
}
.action-buttons a:hover {background:#b8895b; transform:scale(1.05);}

/* ===== ORDER SECTION ===== */
#order p {text-align:center; font-size:20px; margin-bottom:10px;}
#order a {font-weight:bold; color:#5a3e36; font-size:22px;}

/* ===== FOOTER ===== */
footer {
  background:#5a3e36;
  color:#fff;
  text-align:center;
  padding:40px 20px;
  font-size:18px;
}
footer a {color:#f5f2ef; font-weight:600; font-size:20px;}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <h1>Sarah Tallat</h1>
  <p>تحف التورت اللي بتتحول لفن 🎂✨</p>
  <div class="buttons">
    <a href="#gallery">معرض الصور</a>
    <a href="tel:01550872032">📞 اتصل الآن</a>
    <a href="https://wa.me/201550872032" target="_blank">💬 واتساب</a>
    <a href="#order">📦 اطلب تورتك</a>
  </div>
</div>

<!-- GALLERY -->
<section id="gallery">
  <h2>معرض الصور</h2>
  <div class="gallery">
    <div class="img-box"><img src="jpg.1767750650772" alt="Cake 1"></div>
    <div class="img-box"><img src="jpg.1767750650760" alt="Cake 2"></div>
    <div class="img-box"><img src="jpg.1767750650748" alt="Cake 3"></div>
    <div class="img-box"><img src="jpg.1767750650737" alt="Cake 4"></div>
    <div class="img-box"><img src="jpg.1767750650722" alt="Cake 5"></div>
    <div class="img-box"><img src="jpg.1767750650710" alt="Cake 6"></div>
    <div class="img-box"><img src="jpg.1767750650697" alt="Cake 7"></div>
    <div class="img-box"><img src="jpg.1767750650683" alt="Cake 8"></div>
    <div class="img-box"><img src="jpg.1767750650670" alt="Cake 9"></div>
    <div class="img-box"><img src="jpg.1767750650652" alt="Cake 10"></div>
  </div>
</section>

<!-- ACTION BUTTONS UNDER GALLERY -->
<div class="action-buttons">
  <a href="tel:01550872032">📞 اتصل الآن</a>
  <a href="https://wa.me/201550872032" target="_blank">💬 واتساب</a>
  <a href="#order">📦 اطلب تورتك</a>
</div>

<!-- ORDER SECTION -->
<section id="order">
  <h2>اطلب تورتك الآن</h2>
  <p>للطلب والاستفسار عن الأسعار، اتصل أو راسل على واتساب:</p>
  <p><a href="tel:01550872032">01550872032</a> | <a href="https://wa.me/201550872032" target="_blank">واتساب</a></p>
</section>

<!-- FOOTER -->
<footer>
  &copy; 2026 Sarah Tallat Cakes. جميع الحقوق محفوظة.
</footer>

<!-- JS -->
<script>
// فتح الصور في نافذة جديدة عند الضغط
const images = document.querySelectorAll(".gallery img");
images.forEach(img => {
  img.addEventListener("click", ()=> {
    const src = img.getAttribute("src");
    const w = window.open("");
    w.document.write(`<img src="${src}" style="width:100%">`);
  });
});
</script>

</body>
</html>
