<title>Sarah Tallat | Cake Art</title>

<style>
/* ======== Reset ======== */
* {margin:0; padding:0; box-sizing:border-box;}

/* ======== Variables ======== */
:root {
  --light-bg: #f0f0f0;
  --light-text: #2c2c2c;
  --dark-bg: #1e1e1e;
  --dark-text: #f5f5f5;
  --accent: #d4a373;
  --accent-hover: #b8895b;
}

/* ======== Body ======== */
body {
  font-family: Arial, sans-serif;
  scroll-behavior: smooth;
  transition: background 0.5s, color 0.5s;
  background: var(--light-bg);
  color: var(--light-text);
}

/* ======== Dark Mode ======== */
body.dark-mode {
  background: var(--dark-bg);
  color: var(--dark-text);
}

/* ======== Toggle Button ======== */
#toggle-theme {
  position: fixed;
  top: 20px;
  right: 20px;
  padding:10px 20px;
  border:none;
  border-radius:30px;
  background: var(--accent);
  color:#fff;
  cursor:pointer;
  font-weight:bold;
  z-index:1000;
  transition:.3s;
}
#toggle-theme:hover { background: var(--accent-hover); }

/* ======== Hero Section ======== */
.hero {
  text-align: center;
  padding: 60px 20px;
}
.hero h1 {font-size: 60px; margin-bottom:15px;}
.hero p {font-size:22px; margin-bottom:25px;}
.buttons a {
  display:inline-block;
  margin:5px;
  padding:15px 30px;
  border-radius:35px;
  background:var(--accent);
  color:#fff;
  font-weight:600;
  text-decoration:none;
  transition:0.3s;
}
.buttons a:hover { background: var(--accent-hover); transform: scale(1.05); }

/* ======== Gallery ======== */
section {
  padding:50px 10%;
}
section h2 {text-align:center; font-size:36px; margin-bottom:40px;}
.gallery {display:flex; flex-direction:column; gap:30px; align-items:center;}
.gallery .img-box {
  width:90%;
  max-width:600px;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
.gallery .img-box img {
  width:100%;
  display:block;
  cursor:pointer;
  transition:0.3s;
}
.gallery .img-box img:hover { transform:scale(1.05); }

/* ======== Action Buttons ======== */
.action-buttons {
  text-align:center;
  margin-top:40px;
}
.action-buttons a {
  display:inline-block;
  margin:8px;
  padding:12px 28px;
  border-radius:30px;
  background:var(--accent);
  color:#fff;
  font-weight:600;
  text-decoration:none;
  transition:0.3s;
}
.action-buttons a:hover { background: var(--accent-hover); transform: scale(1.05); }

/* ======== Order Section ======== */
#order {margin-top:60px; text-align:center;}
#order p {font-size:20px; margin-bottom:10px;}
#order a {font-weight:bold; color:var(--accent); font-size:22px; text-decoration:none;}

/* ======== Footer ======== */
footer {
  background:#5a3e36;
  color:#fff;
  text-align:center;
  padding:40px 20px;
  font-size:18px;
}
footer a {color:#f5f2ef; font-weight:600;}
</style>

<script>
// Toggle Dark Mode
const toggleBtn = document.getElementById('toggle-theme');
toggleBtn.addEventListener('click', () => {

});

// Image popup
document.querySelectorAll('.gallery img').forEach(img => {

});
