<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarah Tallat | Cake Art</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
/* ===== RESET ===== */
* {margin:0;padding:0;box-sizing:border-box;}
body {font-family:'Poppins',sans-serif; background:#f5f2ef; color:#333; scroll-behavior:smooth;}
a {text-decoration:none;}

/* ===== HERO ===== */
.hero {
  min-height:100vh;
  display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
  background: linear-gradient(135deg, #f2e6d9, #e6dcd2);
  animation: glow 5s ease-in-out infinite alternate;
}
.hero h1 {font-family:'Playfair Display',serif; font-size:60px; color:#5a3e36; margin-bottom:10px;}
.hero p {font-size:22px; color:#6b4f3f; margin-bottom:25px;}
.hero .buttons a {
  display:inline-block; margin:5px; padding:15px 30px; border-radius:35px;
  background:#d4a373; color:#fff; font-weight:600; transition:.3s;
}
.hero .buttons a:hover {background:#b8895b; transform:scale(1.05);}

/* ===== ANIMATION ===== */
@keyframes glow {
  0% {background: linear-gradient(135deg, #f2e6d9, #e6dcd2);}
  50% {background: linear-gradient(135deg, #e6dcd2, #f2e6d9);}
  100% {background: linear-gradient(135deg, #f2e6d9, #e6dcd2);}
}

/* ===== SECTIONS ===== */
section {padding:70px 8%;}
section h2 {text-align:center; font-family:'Playfair Display',serif; font-size:36px; margin-bottom:40px; color:#5a3e36;}

/* ===== GALLERY ===== */
.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}
.gallery img {
  width:100%;
  border-radius:18px;
  cursor:pointer;
  transition:.4s;
}
.gallery img:hover {
  transform:scale(1.05);
  box-shadow:0 15px 35px rgba(0,0,0,.2);
}

/* ===== BUTTONS UNDER GALLERY ===== */
.action-buttons {
  text-align:center;
  margin-top:40px;
}
.action-buttons a {
  display:inline-block;
  margin:8px;
  padding:12px 28px;
  border-radius:30px;
  background:#d4a373;
  color:#fff;
  font-weight:600;
  font-size:18px;
  transition:.3s;
}
.action-buttons a:hover {background:#b8895b; transform:scale(1.05);}

/* ===== FOOTER ===== */
footer {
  background:#5a3e36;
  color:#fff;
  text-align:center;
  padding:40px 20px;
  font-size:18px;
}
footer a {color:#f5f2ef; font-weight:600; font-size:20px;}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <h1>Sarah Tallat</h1>
  <p>تحف التورت اللي بتتحول لفن 🎂✨</p>
  <div class="buttons">
    <a href="#gallery">معرض الصور</a>
    <a href="tel:01550872032">📞 اتصل الآن</a>
    <a href="https://wa.me/201550872032" target="_blank">💬 واتساب</a>
    <a href="#order">📦 اطلب تورتك</a>
  </div>
</div>

<!-- LATEST CAKES -->
<section id="gallery">
  <h2>معرض الصور</h2>
  <div class="gallery">
    <img src="jpg.1767750650772">
    <img src="jpg.1767750650760">
    <img src="jpg.1767750650748">
    <img src="jpg.1767750650737">
    <img src="jpg.1767750650722">
    <img src="jpg.1767750650710">
    <img src="jpg.1767750650697">
    <img src="jpg.1767750650683">
    <img src="jpg.1767750650670">
    <img src="jpg.1767750650652">
  </div>
</section>

<!-- ACTION BUTTONS UNDER GALLERY -->
<div class="action-buttons">
  <a href="tel:01550872032">📞 اتصل الآن</a>
  <a href="https://wa.me/201550872032" target="_blank">💬 واتساب</a>
  <a href="#order">📦 اطلب تورتك</a>
</div>

<!-- ORDER SECTION -->
<section id="order">
  <h2>اطلب تورتك الآن</h2>
  <p style="text-align:center; font-size:20px;">للطلب والاستفسار عن الأسعار، اتصل أو راسل على واتساب:</p>
  <p style="text-align:center; font-size:22px; font-weight:bold;"><a href="tel:01550872032">01550872032</a> | <a href="https://wa.me/201550872032" target="_blank">واتساب</a></p>
</section>

<!-- FOOTER -->
<footer>
  &copy; 2026 Sarah Tallat Cakes. جميع الحقوق محفوظة.
</footer>

<!-- JS -->
<script>
// كود لتكبير الصور عند الضغط
const images = document.querySelectorAll(".gallery img");
images.forEach(img => {
  img.addEventListener("click", ()=> {
    const src = img.getAttribute("src");
    const w = window.open("");
    w.document.write(`<img src="${src}" style="width:100%">`);
  });
});
</script>

</body>
</html>
