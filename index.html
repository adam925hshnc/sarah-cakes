<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarah Tallat | Cake Art</title>
<style>
/* ======== Reset & Body ======== */
* {margin:0; padding:0; box-sizing:border-box;}
body {
  font-family: Arial, sans-serif;
  scroll-behavior: smooth;
  background: linear-gradient(-45deg,#f9d6c1,#ffe3e3,#f9d6c1,#c1f0f0);
  background-size: 400% 400%;
  animation: bgAnimation 15s ease infinite;
}
@keyframes bgAnimation {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* ======== Hero Section ======== */
.hero {
  text-align: center;
  padding: 60px 20px;
}
.hero h1 {
  font-size: 60px;
  color: #5a3e36;
  margin-bottom: 15px;
}
.hero p {
  font-size: 22px;
  color: #6b4f3f;
  margin-bottom: 25px;
}
.buttons a {
  display:inline-block;
  margin:5px;
  padding:15px 30px;
  border-radius:35px;
  background:#d4a373;
  color:#fff;
  font-weight:600;
  font-size:18px;
  text-decoration:none;
  transition:0.3s;
}
.buttons a:hover {
  background:#b8895b;
  transform: scale(1.05);
}

/* ======== Gallery Section ======== */
section {
  padding:50px 10%;
}
section h2 {
  text-align:center;
  font-size:36px;
  margin-bottom:40px;
  color:#5a3e36;
}
.gallery {
  display:flex;
  flex-direction:column;
  gap:30px;
  align-items:center;
}
.gallery .img-box {
  width: 90%;
  max-width: 600px;
  border-radius: 20px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
.gallery .img-box img {
  width:100%;
  display:block;
  transition:0.3s;
  cursor:pointer;
}
.gallery .img-box img:hover {
  transform:scale(1.05);
}

/* ======== Action Buttons ======== */
.action-buttons {
  text-align:center;
  margin-top:40px;
}
.action-buttons a {
  display:inline-block;
  margin:8px;
  padding:12px 28px;
  border-radius:30px;
  background:#d4a373;
  color:#fff;
  font-weight:600;
  font-size:18px;
  text-decoration:none;
  transition:0.3s;
}
.action-buttons a:hover {
  background:#b8895b;
  transform: scale(1.05);
}

/* ======== Order Section ======== */
#order {
  margin-top:60px;
  text-align:center;
}
#order p {
  font-size:20px;
  margin-bottom:10px;
}
#order a {
  font-weight:bold;
  color:#5a3e36;
  font-size:22px;
}

/* ======== Footer ======== */
footer {
  background:#5a3e36;
  color:#fff;
  text-align:center;
  padding:40px 20px;
  font-size:18px;
}
footer a {
  color:#f5f2ef;
  font-weight:600;
  font-size:20px;
}
</style>
</head>
<body>

<!-- ======== Hero Section ======== -->
<div class="hero">
  <h1>Sarah Tallat</h1>
  <p>تحف التورت اللي بتتحول لفن 🎂✨</p>
  <div class="buttons">

<!-- ======== Gallery Section ======== -->
<section id="gallery">

  <div class="gallery">
    <div class="img-box"><img src="1767750650772.jpg" alt="Cake 1"></div>
    <div class="img-box"><img src="1767750650760.jpg" alt="Cake 2"></div>
    <div class="img-box"><img src="1767750650748.jpg" alt="Cake 3"></div>
    <div class="img-box"><img src="1767750650737.jpg" alt="Cake 4"></div>
    <div class="img-box"><img src="1767750650722.jpg" alt="Cake 5"></div>

    <div class="img-box"><img src="1767750650670.jpg" alt="Cake 9"></div>
    <div class="img-box"><img src="1767750650652.jpg" alt="Cake 10"></div>
    <div class="img-box"><img src="Poloty6.jpg" alt="Cake 11"></div>

</section>

<!-- ======== Action Buttons ======== -->
<div class="action-buttons">
  <a href="tel:01550872032">📞 اتصل الآن</a>

</section>

<!-- ======== Footer ======== -->
<footer>
  &copy; 2026 Sarah Tallat Cakes. جميع الحقوق محفوظة.
</footer>

<!-- ======== Script for Image Popup ======== -->
<script>
document.querySelectorAll('.gallery img').forEach(img => {
  img.addEventListener('click', ()=> {
    const src = img.src;
    const w = window.open("");
    w.document.write(`<img src="${src}" style="width:100%">`);
  });
});
</script>

</body>
</html>
